[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awsnap"
version = "0.1.0"
description = "Snapshot an AWS account into one offline, SQL-queryable HTML file (DuckDB-WASM + embedded Parquet)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.28",
  "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
]

[project.scripts]
awsnap = "awsnap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awsnap"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: needs chromium + network (jsDelivr)"]
